<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spin Fallstreaks</title>
    <style>
        @font-face {
            font-family: 'Pusab';
            src: url('Pusab.otf');
        }

        body {
            background-color: #000926;
            color: #0086C9;
            font-family: 'Pusab', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-top: 10px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #7dd3fc, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 2px rgba(0, 0, 0, 0.5);
        }

        .pack-img {
            width: 280px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .pack-img:hover {
            transform: scale(1.06);
        }

        .pack-img:active {
            transform: scale(0.96);
        }

        .info-text {
            font-size: 1.5rem;
            margin-top: 10px;
            -webkit-text-stroke: 1px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <h1>FALLSTREAK GATCHA</h1>

    <img src="fallstreakpack.png" alt="Fallstreak Pack" class="pack-img" id="pack-btn">

    <div class="info-text">Packs: <span id="pack-count">15</span> / 15</div>
    <div class="info-text" id="timer-text">Next pack in: 10:00</div>
</body>
<script>
        const MAX_PACKS = 15;
        const REGEN_TIME = 10 * 60 * 1000;

        let packs = localStorage.getItem('fs_packs') !== null ? parseInt(localStorage.getItem('fs_packs')) : MAX_PACKS;
        let lastTime = localStorage.getItem('fs_lastTime') !== null ? parseInt(localStorage.getItem('fs_lastTime')) : Date.now();

        const packBtn = document.getElementById('pack-btn');
        const packCountEl = document.getElementById('pack-count');
        const timerTextEl = document.getElementById('timer-text');

        function saveProgress() {
            localStorage.setItem('fs_packs', packs);
            localStorage.setItem('fs_lastTime', lastTime);
        }

        function updateGame() {
            const now = Date.now();

            if (packs < MAX_PACKS) {
                const passed = now - lastTime;
                const earned = Math.floor(passed / REGEN_TIME);

                if (earned > 0) {
                    packs = Math.min(MAX_PACKS, packs + earned);
                    lastTime = packs === MAX_PACKS ? now : lastTime + (earned * REGEN_TIME);
                    saveProgress();
                }
            } else {
                lastTime = now;
            }

            packCountEl.innerText = packs;

            if (packs >= MAX_PACKS) {
                timerTextEl.innerText = "Packs are full!";
            } else {
                const timeLeft = REGEN_TIME - (now - lastTime);
                const mins = Math.floor(timeLeft / 60000);
                const secs = Math.floor((timeLeft % 60000) / 1000);
                timerTextEl.innerText = `Next pack in: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
        }

        packBtn.addEventListener('click', () => {
            if (packs > 0) {
                if (packs === MAX_PACKS) {
                    lastTime = Date.now();
                }
                packs--;
                saveProgress();
                updateGame();
            }
        });

        setInterval(updateGame, 1000);
        updateGame();
    </script>

</html>
