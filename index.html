<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Fallstreaks</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --common: #94a3b8;
            --uncommon: #4ade80;
            --rare: #38bdf8;
            --epic: #c084fc;
            --mythic: #f43f5e;
            --legendary: #fbbf24;
            --special: #2dd4bf;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #38bdf8, #c084fc, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-bar {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            gap: 20px;
            align-items: center;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover:not(:disabled) { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            min-height: 280px;
        }

        .card {
            background: var(--card-bg);
            width: 180px;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 3px solid var(--common);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            animation: popIn 0.4s ease-out;
            position: relative;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #0f172a;
        }

        .card-rarity {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-odds {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .card-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 4px 0;
        }

        .card-desc {
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .card-dupes {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.4);
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: auto;
        }

        /* Boje okvira po rijetkosti */
        .rarity-Common { border-color: var(--common); }
        .rarity-Common .card-rarity { color: var(--common); }

        .rarity-Uncommon { border-color: var(--uncommon); }
        .rarity-Uncommon .card-rarity { color: var(--uncommon); }

        .rarity-Rare { border-color: var(--rare); box-shadow: 0 0 12px rgba(56, 189, 248, 0.3); }
        .rarity-Rare .card-rarity { color: var(--rare); }

        .rarity-Epic { border-color: var(--epic); box-shadow: 0 0 15px rgba(192, 132, 252, 0.4); }
        .rarity-Epic .card-rarity { color: var(--epic); }

        .rarity-Mythic { border-color: var(--mythic); box-shadow: 0 0 18px rgba(244, 63, 94, 0.5); }
        .rarity-Mythic .card-rarity { color: var(--mythic); }

        .rarity-Legendary { border-color: var(--legendary); box-shadow: 0 0 22px rgba(251, 191, 36, 0.6); }
        .rarity-Legendary .card-rarity { color: var(--legendary); }

        .rarity-Special { border-color: var(--special); box-shadow: 0 0 25px rgba(45, 212, 191, 0.8); }
        .rarity-Special .card-rarity { color: var(--special); }

        .inventory-section {
            width: 100%;
            max-width: 1000px;
            margin-top: 40px;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <h1>SPIN FALLSTREAKS</h1>
    <p>Otvori pack od 5 kartica iz zajednice!</p>

    <div class="status-bar">
        <div>Packovi: <strong id="pack-count">15</strong> / 15</div>
        <div id="timer-box">Sljedeći pack za: <strong id="timer">10:00</strong></div>
        <button id="open-btn" onclick="openPack()">OTVORI PACK (5x)</button>
    </div>

    <!-- Prikaz tek otvorenih kartica -->
    <div class="cards-container" id="pack-result"></div>

    <!-- Kolekcija svih skupljenih kartica -->
    <div class="inventory-section">
        <h2>Tvoja Kolekcija (<span id="unique-count">0</span> / <span id="total-cards">0</span>)</h2>
        <div class="cards-container" id="inventory-grid"></div>
    </div>

    <script>
        // 1. DEFINICIJA RIJETKOSTI (Težine za izvlačenje i tekst šanse)
        const RARITIES = [
            { name: "Common", weight: 5000, oddsText: "1 / 2" },
            { name: "Uncommon", weight: 2500, oddsText: "1 / 4" },
            { name: "Rare", weight: 1500, oddsText: "1 / 7" },
            { name: "Epic", weight: 700, oddsText: "1 / 14" },
            { name: "Mythic", weight: 250, oddsText: "1 / 40" },
            { name: "Legendary", weight: 48, oddsText: "1 / 200" },
            { name: "Special", weight: 2, oddsText: "1 / 5,000" }
        ];

        // 2. BAZA KARTICA (Ovdje dodaješ svoje slike, ljude i fore iz zajednice!)
        const CARD_POOL = [
            { id: "c1", name: "Random Lurker", rarity: "Common", desc: "Samo gleda chat i nikad ništa ne piše.", img: "https://placeholder.com" },
            { id: "c2", name: "GG Spammer", rarity: "Common", desc: "Napiše GG prije nego level uopće završi.", img: "https://placeholder.com" },
            { id: "u1", name: "Active Chatter", rarity: "Uncommon", desc: "Uvijek tu kad krene stream.", img: "https://placeholder.com" },
            { id: "r1", name: "Discord Mod", rarity: "Rare", desc: "Pazi da nitko ne krši pravila u generalu.", img: "https://placeholder.com" },
            { id: "e1", name: "Level Creator", rarity: "Epic", desc: "Gradi layout koji nikad neće dovršiti.", img: "https://placeholder.com" },
            { id: "m1", name: "98% Fail", rarity: "Mythic", desc: "Najbolniji trenutak u povijesti kanala.", img: "https://placeholder.com" },
            { id: "l1", name: "Thinking Space", rarity: "Legendary", desc: "Fallstreakov hardest demon. Legendaran grind!", img: "https://placeholder.com" },
            { id: "s1", name: "Fallstreak (Prime)", rarity: "Special", desc: "Glavni čovjek osobno. Gotovo nemoguće dobiti!", img: "https://placeholder.com" }
        ];

        // 3. SUSTAV PACKOVA I VREMENA
        const MAX_PACKS = 15;
        const REGEN_MS = 10 * 60 * 1000; // 10 minuta u milisekundama

        let state = JSON.parse(localStorage.getItem("fallstreakGacha")) || {
            packs: MAX_PACKS,
            lastRegen: Date.now(),
            inventory: {}
        };

        function saveState() {
            localStorage.setItem("fallstreakGacha", JSON.stringify(state));
        }

        function updatePacks() {
            const now = Date.now();
            if (state.packs < MAX_PACKS) {
                const elapsed = now - state.lastRegen;
                const packsEarned = Math.floor(elapsed / REGEN_MS);
                if (packsEarned > 0) {
                    state.packs = Math.min(MAX_PACKS, state.packs + packsEarned);
                    state.lastRegen = state.packs === MAX_PACKS ? now : state.lastRegen + (packsEarned * REGEN_MS);
                    saveState();
                }
            } else {
                state.lastRegen = now;
            }
            renderUI();
        }

        function rollRarity() {
            const totalWeight = RARITIES.reduce((sum, r) => sum + r.weight, 0);
            let random = Math.random() * totalWeight;
            for (let r of RARITIES) {
                if (random < r.weight) return r;
                random -= r.weight;
            }
            return RARITIES[0];
        }

        function openPack() {
            if (state.packs <= 0) return;

            if (state.packs === MAX_PACKS) {
                state.lastRegen = Date.now();
            }
            state.packs--;

            const resultContainer = document.getElementById("pack-result");
            resultContainer.innerHTML = "";

            for (let i = 0; i < 5; i++) {
                const chosenRarity = rollRarity();
                const possibleCards = CARD_POOL.filter(c => c.rarity === chosenRarity.name);
                const card = possibleCards.length > 0 
                    ? possibleCards[Math.floor(Math.random() * possibleCards.length)] 
                   : CARD_POOL[0];

                state.inventory[card.id] = (state.inventory[card.id] || 0) + 1;
                resultContainer.appendChild(createCardElement(card, chosenRarity.oddsText, state.inventory[card.id]));
            }

            saveState();
            renderUI();
            renderInventory();
        }

        function createCardElement(card, oddsText, count) {
            const div = document.createElement("div");
            div.className = `card rarity-${card.rarity}`;
            div.innerHTML = `
                <div class="card-rarity">${card.rarity}</div>
                <div class="card-odds">Šansa: ${oddsText}</div>
                <img src="${card.img}" alt="${card.name}">
                <div class="card-name">${card.name}</div>
                <div class="card-desc">${card.desc}</div>
                <div class="card-dupes">U kolekciji: <strong>x${count}</strong></div>
            `;
            return div;
        }

        function renderUI() {
            document.getElementById("pack-count").innerText = state.packs;
            document.getElementById("open-btn").disabled = state.packs <= 0;

            const timerBox = document.getElementById("timer-box");
            if (state.packs >= MAX_PACKS) {
                timerBox.innerHTML = "<strong>Packovi su puni!</strong>";
            } else {
                const remaining = REGEN_MS - (Date.now() - state.lastRegen);
                const mins = Math.floor(remaining / 60000);
                const secs = Math.floor((remaining % 60000) / 1000);
                timerBox.innerHTML = `Sljedeći pack za: <strong>${mins}:${secs < 10 ? '0' : ''}${secs}</strong>`;
            }
        }

        function renderInventory() {
            const invGrid = document.getElementById("inventory-grid");
            invGrid.innerHTML = "";
            let uniqueUnlocked = 0;

            CARD_POOL.forEach(card => {
                const count = state.inventory[card.id] || 0;
                if (count > 0) {
                    uniqueUnlocked++;
                    const rarityObj = RARITIES.find(r => r.name === card.rarity);
                    invGrid.appendChild(createCardElement(card, rarityObj ? rarityObj.oddsText : "?", count));
                }
            });

            document.getElementById("unique-count").innerText = uniqueUnlocked;
            document.getElementById("total-cards").innerText = CARD_POOL.length;
        }

        setInterval(updatePacks, 1000);
        updatePacks();
        renderInventory();
